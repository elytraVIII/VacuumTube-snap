name: Build Snap Package

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-snap:
    name: Build Snap Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic

      - name: Build Snap with electron-builder
        run: |
          npm run build:snap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate built snap package
        id: find_snap
        run: |
          SNAP_FILE=$(ls dist/*.snap | head -n 1)
          echo "Found snap: $SNAP_FILE"
          echo "snap_path=$SNAP_FILE" >> $GITHUB_OUTPUT
          echo "snap_name=$(basename $SNAP_FILE)" >> $GITHUB_OUTPUT

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_snap.outputs.snap_name }}
          path: ${{ steps.find_snap.outputs.snap_path }}
          if-no-files-found: error

      - name: Create or Update GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release upload "${{ github.ref_name }}" "${{ steps.find_snap.outputs.snap_path }}" --clobber || \
          gh release create "${{ github.ref_name }}" "${{ steps.find_snap.outputs.snap_path }}" --title "Release ${{ github.ref_name }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Snap Store (Optional)
        uses: canonical/action-publish@v1
        if: env.SNAPCRAFT_STORE_CREDENTIALS != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.find_snap.outputs.snap_path }}
          release: candidate
